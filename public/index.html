<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction ITB/Bid Management System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .table-cell { border: 1px solid #e5e7eb; padding: 0.5rem; }
        .editable-cell { cursor: text; }
        .editable-cell:hover { background-color: #f9fafb; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Configuration
        const API_BASE_URL = window.location.origin;
        
        // API Helper Functions
        const api = {
            getToken: () => localStorage.getItem('token'),
            setToken: (token) => localStorage.setItem('token', token),
            clearToken: () => localStorage.removeItem('token'),
            
            headers: () => {
                const token = api.getToken();
                console.log('Token exists:', !!token);
                return {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                };
            },

            async login(email, password) {
                const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.token) {
                    api.setToken(data.token);
                }
                return data;
            },

            async getProjects() {
                const res = await fetch(`${API_BASE_URL}/api/projects`, {
                    headers: api.headers()
                });
                return await res.json();
            },

            async getSubcontractors() {
                const res = await fetch(`${API_BASE_URL}/api/subcontractors`, {
                    headers: api.headers()
                });
                return await res.json();
            },

            async createSubcontractor(data) {
                console.log('Sending POST to /api/subcontractors:', data);
                const res = await fetch(`${API_BASE_URL}/api/subcontractors`, {
                    method: 'POST',
                    headers: api.headers(),
                    body: JSON.stringify(data)
                });
                console.log('Response status:', res.status);
                
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('API Error:', res.status, errorText);
                    throw new Error(`Server error: ${res.status} - ${errorText}`);
                }
                
                const result = await res.json();
                console.log('Created subcontractor:', result);
                return result;
            },
            async updateSubcontractor(id, data) {
                console.log('Sending PUT to /api/subcontractors/' + id, data);
                const res = await fetch(`${API_BASE_URL}/api/subcontractors/${id}`, {
                    method: 'PUT',
                    headers: api.headers(),
                    body: JSON.stringify(data)
                });
                console.log('Response status:', res.status);
                
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('API Error:', res.status, errorText);
                    throw new Error(`Server error: ${res.status} - ${errorText}`);
                }
                
                const result = await res.json();
                console.log('API response:', result);
                return result;
            },

            async sendITBs(projectId, subcontractorIds, emailSubject, emailBody) {
                const res = await fetch(`${API_BASE_URL}/api/itbs`, {
                    method: 'POST',
                    headers: api.headers(),
                    body: JSON.stringify({
                        project_id: projectId,
                        subcontractor_ids: subcontractorIds,
                        email_subject: emailSubject,
                        email_body: emailBody
                    })
                });
                return await res.json();
            }
        };

        const CSI_DIVISIONS = [
            { code: "03", name: "Concrete" },
            { code: "04", name: "Masonry" },
            { code: "05", name: "Metals" },
            { code: "06", name: "Wood, Plastics, and Composites" },
            { code: "07", name: "Thermal and Moisture Protection" },
            { code: "08", name: "Openings" },
            { code: "09", name: "Finishes" },
            { code: "21", name: "Fire Suppression" },
            { code: "22", name: "Plumbing" },
            { code: "23", name: "HVAC" },
            { code: "26", name: "Electrical" },
            { code: "31", name: "Earthwork" },
            { code: "32", name: "Exterior Improvements" }
        ];

        // Login Component
        function Login({ onLogin }) {
            const [email, setEmail] = useState('john@construction.com');
            const [password, setPassword] = useState('password123');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    const data = await api.login(email, password);
                    if (data.token) {
                        onLogin(data.user);
                    } else {
                        setError(data.error || 'Login failed');
                    }
                } catch (err) {
                    setError('Connection error. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
                        <h1 className="text-2xl font-bold text-gray-900 mb-6">ITB/Bid Management System</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>
                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
                                    {error}
                                </div>
                            )}
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium disabled:opacity-50"
                            >
                                {loading ? 'Logging in...' : 'Login'}
                            </button>
                            <p className="text-sm text-gray-600 mt-4">
                                Demo: john@construction.com / password123
                            </p>
                        </form>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [currentView, setCurrentView] = useState("dashboard");
            const [projects, setProjects] = useState([]);
            const [selectedProject, setSelectedProject] = useState(null);
            const [subcontractors, setSubcontractors] = useState([]);
            const [bids, setBids] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isPublicBidPortal, setIsPublicBidPortal] = useState(false);
            const [itbId, setItbId] = useState(null);

            // Check URL on mount to detect if we're on the public bid portal
            useEffect(() => {
                const path = window.location.pathname;
                const params = new URLSearchParams(window.location.search);
                
                if (path === '/bid-portal' || path === '/bid-portal/') {
                    const id = params.get('itb_id');
                    if (id) {
                        setIsPublicBidPortal(true);
                        setItbId(id);
                        setLoading(false);
                        console.log('Public bid portal detected, ITB ID:', id);
                    } else {
                        console.error('No itb_id parameter found in URL');
                        setLoading(false);
                    }
                }
            }, []);

            // Function to load/reload data from API
            const loadData = async () => {
                console.log('Loading data... Token exists:', !!api.getToken());
                
                if (!api.getToken()) {
                    console.log('No token found, user needs to login');
                    setLoading(false);
                    return;
                }
                
                try {
                    console.log('Fetching projects and subcontractors from API...');
                    const [projectsData, subsData] = await Promise.all([
                        api.getProjects(),
                        api.getSubcontractors()
                    ]);
                    
                    console.log('Loaded projects:', projectsData.length);
                    console.log('Loaded subcontractors:', subsData.length);
                    
                    setProjects(projectsData.map(p => ({
                        ...p,
                        projectNumber: p.project_number,
                        bidDueDate: p.bid_due_date,
                        createdBy: p.created_by_name
                    })));
                    
                    setSubcontractors(subsData.map(s => ({
                        ...s,
                        csiCode: s.csi_code,
                        contactPerson: s.contact_person
                    })));
                    
                    console.log('✅ Data loaded successfully');
                } catch (err) {
                    console.error('❌ Failed to load data:', err);
                    alert('Failed to load data from server. Please try logging out and back in.');
                } finally {
                    setLoading(false);
                }
            };

            // Check for existing token on mount
            useEffect(() => {
                const checkAuth = async () => {
                    const token = api.getToken();
                    if (token) {
                        console.log('Found existing token, verifying...');
                        try {
                            // Verify token by fetching user data
                            const res = await fetch(`${API_BASE_URL}/api/auth/me`, {
                                headers: api.headers()
                            });
                            if (res.ok) {
                                const userData = await res.json();
                                console.log('Token valid, auto-login successful');
                                setCurrentUser(userData);
                            } else {
                                console.log('Token invalid, clearing');
                                api.clearToken();
                                setLoading(false);
                            }
                        } catch (err) {
                            console.error('Token verification failed:', err);
                            api.clearToken();
                            setLoading(false);
                        }
                    } else {
                        console.log('No existing token found');
                        setLoading(false);
                    }
                };
                checkAuth();
            }, []);

            // Load data from API when user logs in
            useEffect(() => {
                if (currentUser) {
                    loadData();
                }
            }, [currentUser]);

            const handleLogin = (user) => {
                setCurrentUser(user);
            };

            const handleLogout = () => {
                api.clearToken();
                setCurrentUser(null);
                setProjects([]);
                setSubcontractors([]);
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-gray-600">Loading...</div>
                    </div>
                );
            }

            // Public Bid Portal (no authentication required)
            if (isPublicBidPortal) {
                return <PublicBidPortal itbId={itbId} />;
            }

            if (!currentUser) {
                return <Login onLogin={handleLogin} />;
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">ITB/Bid Management System</h1>
                                    <p className="text-sm text-gray-600 mt-1">
                                        {currentUser.name} - {currentUser.role}
                                        {api.getToken() ? ' 🟢 Connected' : ' 🔴 Not Authenticated'}
                                    </p>
                                </div>
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setCurrentView("dashboard")}
                                        className={`px-4 py-2 rounded-lg font-medium ${currentView === "dashboard" ? "bg-blue-600 text-white" : "bg-gray-100 text-gray-700 hover:bg-gray-200"}`}
                                    >
                                        Dashboard
                                    </button>
                                    <button
                                        onClick={() => setCurrentView("subcontractors")}
                                        className={`px-4 py-2 rounded-lg font-medium ${currentView === "subcontractors" ? "bg-blue-600 text-white" : "bg-gray-100 text-gray-700 hover:bg-gray-200"}`}
                                    >
                                        Subcontractors
                                    </button>
                                    <button
                                        onClick={() => setCurrentView("subPortal")}
                                        className="px-4 py-2 rounded-lg font-medium bg-green-600 text-white hover:bg-green-700"
                                    >
                                        Sub Portal
                                    </button>
                                    <button
                                        onClick={handleLogout}
                                        className="px-4 py-2 rounded-lg font-medium bg-gray-100 text-gray-700 hover:bg-gray-200"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {currentView === "dashboard" && (
                            <Dashboard 
                                projects={projects} 
                                setProjects={setProjects}
                                selectedProject={selectedProject}
                                setSelectedProject={setSelectedProject}
                                setCurrentView={setCurrentView}
                                subcontractors={subcontractors}
                                bids={bids}
                                setBids={setBids}
                            />
                        )}
                        {currentView === "subcontractors" && (
                            <SubcontractorManagement 
                                subcontractors={subcontractors}
                                setSubcontractors={setSubcontractors}
                            />
                        )}
                        {currentView === "subPortal" && (
                            <SubcontractorPortal 
                                projects={projects}
                                bids={bids}
                                setBids={setBids}
                            />
                        )}
                        {currentView === "createITB" && selectedProject && (
                            <CreateITB 
                                project={selectedProject}
                                subcontractors={subcontractors}
                                setCurrentView={setCurrentView}
                                loadData={loadData}
                                bids={bids}
                                setBids={setBids}
                            />
                        )}
                        {currentView === "compareBids" && selectedProject && (
                            <BidComparison 
                                project={selectedProject}
                                bids={bids}
                                subcontractors={subcontractors}
                                setCurrentView={setCurrentView}
                            />
                        )}
                    </main>
                </div>
            );
        }

        // Dashboard Component
        function Dashboard({ projects, setProjects, selectedProject, setSelectedProject, setCurrentView, subcontractors, bids, setBids }) {
            const [showNewProject, setShowNewProject] = useState(false);
            const [newProject, setNewProject] = useState({
                name: "",
                projectNumber: "",
                address: "",
                bidDueDate: "",
                status: "Active"
            });

            const handleCreateProject = () => {
                const project = {
                    ...newProject,
                    id: projects.length + 1,
                    createdBy: "John Smith"
                };
                setProjects([...projects, project]);
                setShowNewProject(false);
                setNewProject({ name: "", projectNumber: "", address: "", bidDueDate: "", status: "Active" });
            };

            const handleSelectProject = (project) => {
                setSelectedProject(project);
                setCurrentView("createITB");
            };

            const getProjectBidStats = (projectId) => {
                const projectBids = bids.filter(b => b.projectId === projectId);
                const pending = projectBids.filter(b => b.status === "Pending").length;
                const received = projectBids.filter(b => b.status === "Submitted").length;
                const declined = projectBids.filter(b => b.status === "Declined").length;
                return { pending, received, declined, total: projectBids.length };
            };

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-semibold text-gray-900">Active Projects</h2>
                        <button
                            onClick={() => setShowNewProject(!showNewProject)}
                            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium"
                        >
                            + New Project
                        </button>
                    </div>

                    {showNewProject && (
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6 border border-gray-200">
                            <h3 className="text-lg font-semibold mb-4">Create New Project</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
                                    <input
                                        type="text"
                                        value={newProject.name}
                                        onChange={(e) => setNewProject({...newProject, name: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="Downtown Office Complex"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Project Number</label>
                                    <input
                                        type="text"
                                        value={newProject.projectNumber}
                                        onChange={(e) => setNewProject({...newProject, projectNumber: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="PRJ-2026-001"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Address</label>
                                    <input
                                        type="text"
                                        value={newProject.address}
                                        onChange={(e) => setNewProject({...newProject, address: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="123 Main St"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Bid Due Date</label>
                                    <input
                                        type="date"
                                        value={newProject.bidDueDate}
                                        onChange={(e) => setNewProject({...newProject, bidDueDate: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    />
                                </div>
                            </div>
                            <div className="flex gap-3 mt-4">
                                <button
                                    onClick={handleCreateProject}
                                    className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium"
                                >
                                    Create Project
                                </button>
                                <button
                                    onClick={() => setShowNewProject(false)}
                                    className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="grid gap-4">
                        {projects.map(project => {
                            const stats = getProjectBidStats(project.id);
                            return (
                                <div key={project.id} className="bg-white rounded-lg shadow-sm p-6 border border-gray-200 hover:shadow-md transition-shadow">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="text-lg font-semibold text-gray-900">{project.name}</h3>
                                            <p className="text-sm text-gray-600 mt-1">{project.projectNumber} • {project.address}</p>
                                        </div>
                                        <span className="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium">
                                            {project.status}
                                        </span>
                                    </div>
                                    
                                    <div className="grid grid-cols-4 gap-4 mb-4">
                                        <div className="bg-gray-50 p-3 rounded-lg">
                                            <p className="text-sm text-gray-600">Bid Due Date</p>
                                            <p className="text-lg font-semibold text-gray-900">{new Date(project.bidDueDate).toLocaleDateString()}</p>
                                        </div>
                                        <div className="bg-blue-50 p-3 rounded-lg">
                                            <p className="text-sm text-gray-600">ITBs Sent</p>
                                            <p className="text-lg font-semibold text-blue-900">{stats.total}</p>
                                        </div>
                                        <div className="bg-green-50 p-3 rounded-lg">
                                            <p className="text-sm text-gray-600">Bids Received</p>
                                            <p className="text-lg font-semibold text-green-900">{stats.received}</p>
                                        </div>
                                        <div className="bg-yellow-50 p-3 rounded-lg">
                                            <p className="text-sm text-gray-600">Pending</p>
                                            <p className="text-lg font-semibold text-yellow-900">{stats.pending}</p>
                                        </div>
                                    </div>

                                    <div className="flex gap-3">
                                        <button
                                            onClick={() => handleSelectProject(project)}
                                            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium"
                                        >
                                            Manage ITBs
                                        </button>
                                        <button
                                            onClick={() => {
                                                setSelectedProject(project);
                                                setCurrentView("compareBids");
                                            }}
                                            className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium"
                                        >
                                            Compare Bids
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Subcontractor Management Component
        function SubcontractorManagement({ subcontractors, setSubcontractors }) {
            const [showAddSub, setShowAddSub] = useState(false);
            const [newSub, setNewSub] = useState({ name: "", email: "", csiCode: "", phone: "", contactPerson: "", address: "", notes: "" });
            const [filterCSI, setFilterCSI] = useState("");
            const [saving, setSaving] = useState(false);
            const [error, setError] = useState('');
            const [selectedSub, setSelectedSub] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [editedSub, setEditedSub] = useState(null);

            const handleAddSub = async () => {
                setSaving(true);
                setError('');
                
                try {
                    console.log('Creating subcontractor:', newSub);
                    const data = await api.createSubcontractor({
                        name: newSub.name,
                        email: newSub.email,
                        phone: newSub.phone,
                        csi_code: newSub.csiCode,
                        address: newSub.address,
                        contact_person: newSub.contactPerson,
                        notes: newSub.notes
                    });
                    
                    console.log('Subcontractor created:', data);
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    // Add to local state
                    setSubcontractors([...subcontractors, {
                        ...data,
                        csiCode: data.csi_code,
                        contactPerson: data.contact_person
                    }]);
                    
                    setShowAddSub(false);
                    setNewSub({ name: "", email: "", csiCode: "", phone: "", contactPerson: "", address: "", notes: "" });
                    alert('✅ Subcontractor saved to database successfully!');
                } catch (err) {
                    const errorMsg = err.message || 'Failed to add subcontractor. Please try again.';
                    setError(errorMsg);
                    alert('❌ Error: ' + errorMsg);
                    console.error('Create subcontractor error:', err);
                } finally {
                    setSaving(false);
                }
            };

            const handleEditClick = () => {
                setEditedSub({
                    name: selectedSub.name,
                    email: selectedSub.email,
                    phone: selectedSub.phone,
                    csiCode: selectedSub.csiCode,
                    address: selectedSub.address || '',
                    contactPerson: selectedSub.contactPerson || '',
                    notes: selectedSub.notes || ''
                });
                setIsEditing(true);
            };

            const handleSaveEdit = async () => {
                setSaving(true);
                setError('');
                
                try {
                    console.log('Updating subcontractor:', editedSub);
                    const data = await api.updateSubcontractor(selectedSub.id, {
                        name: editedSub.name,
                        email: editedSub.email,
                        phone: editedSub.phone,
                        csi_code: editedSub.csiCode,
                        address: editedSub.address,
                        contact_person: editedSub.contactPerson,
                        notes: editedSub.notes
                    });
                    
                    console.log('Subcontractor updated:', data);
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    // Update local state
                    setSubcontractors(subcontractors.map(sub => 
                        sub.id === selectedSub.id 
                            ? { ...data, csiCode: data.csi_code, contactPerson: data.contact_person }
                            : sub
                    ));
                    
                    setSelectedSub({ ...data, csiCode: data.csi_code, contactPerson: data.contact_person });
                    setIsEditing(false);
                    alert('✅ Subcontractor updated successfully!');
                } catch (err) {
                    const errorMsg = err.message || 'Failed to update subcontractor. Please try again.';
                    setError(errorMsg);
