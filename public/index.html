        // Create ITB Component
        function CreateITB({ project, subcontractors, setCurrentView, bids, setBids, loadData }) {
            const [selectedSubs, setSelectedSubs] = useState([]);
            const [emailSubject, setEmailSubject] = useState(`Invitation to Bid - ${project.name}`);
            const [emailBody, setEmailBody] = useState(`Dear Subcontractor,\n\nYou are invited to bid on the following project:\n\nProject: ${project.name}\nProject Number: ${project.projectNumber}\nLocation: ${project.address}\nBid Due Date: ${new Date(project.bidDueDate).toLocaleDateString()}\n\nPlease submit your bid through our online portal.\n\nBest regards,\nEstimating Department`);
            const [sending, setSending] = useState(false);
            const [error, setError] = useState('');

            const projectBids = bids.filter(b => b.projectId === project.id);

            const toggleSub = (subId) => {
                if (selectedSubs.includes(subId)) {
                    setSelectedSubs(selectedSubs.filter(id => id !== subId));
                } else {
                    setSelectedSubs([...selectedSubs, subId]);
                }
            };

            const handleSendITB = async () => {
                if (selectedSubs.length === 0) {
                    alert('Please select at least one subcontractor');
                    return;
                }

                setSending(true);
                setError('');

                try {
                    const result = await api.sendITBs(
                        project.id,
                        selectedSubs,
                        emailSubject,
                        emailBody
                    );

                    if (result.itbs) {
                        // Show detailed results
                        const emailResults = result.emailResults || [];
                        const successCount = emailResults.filter(r => r.success).length;
                        const failCount = emailResults.filter(r => !r.success).length;
                        
                        let message = `✅ Successfully sent ${successCount} ITB email(s)!\n\n`;
                        
                        if (failCount > 0) {
                            message += `⚠️ ${failCount} email(s) failed to send.\n\n`;
                        }
                        
                        message += 'Details:\n';
                        emailResults.forEach(r => {
                            if (r.success) {
                                message += `✅ ${r.subcontractor} (${r.email})\n`;
                            } else {
                                message += `❌ ${r.subcontractor} (${r.email}) - ${r.message || r.error}\n`;
                            }
                        });
                        
                        alert(message);
                        setSelectedSubs([]);
                        
                        // Reload data to update ITB counts
                        console.log('🔄 Reloading project data...');
                        await loadData();
                        
                        setCurrentView('dashboard');
                    } else {
                        throw new Error(result.error || 'Failed to send ITBs');
                    }
                } catch (err) {
                    setError('Failed to send ITBs: ' + (err.message || 'Please try again.'));
                    console.error('Send ITB error:', err);
                } finally {
                    setSending(false);
                }
            };

            const groupedSubs = subcontractors.reduce((acc, sub) => {
                if (!acc[sub.csiCode]) acc[sub.csiCode] = [];
                acc[sub.csiCode].push(sub);
                return acc;
            }, {});

            return (
                <div>
                    <div className="mb-6">
                        <button
                            onClick={() => setCurrentView("dashboard")}
                            className="text-blue-600 hover:text-blue-700 font-medium"
                        >
                            ← Back to Dashboard
                        </button>
                    </div>

                    <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200 mb-6">
                        <h2 className="text-xl font-semibold text-gray-900 mb-2">{project.name}</h2>
                        <p className="text-sm text-gray-600">{project.projectNumber} • Bid Due: {new Date(project.bidDueDate).toLocaleDateString()}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-6">
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                            <h3 className="text-lg font-semibold mb-4">Select Subcontractors</h3>
                            <div className="space-y-4 max-h-96 overflow-y-auto">
                                {Object.entries(groupedSubs).map(([csiCode, subs]) => {
                                    const division = CSI_DIVISIONS.find(d => d.code === csiCode);
                                    return (
                                        <div key={csiCode}>
                                            <p className="font-semibold text-gray-700 mb-2">CSI {csiCode} - {division?.name}</p>
                                            {subs.map(sub => {
                                                const alreadySent = projectBids.find(b => b.subcontractorId === sub.id);
                                                return (
                                                    <label key={sub.id} className="flex items-center p-2 hover:bg-gray-50 rounded">
                                                        <input
                                                            type="checkbox"
                                                            checked={selectedSubs.includes(sub.id)}
                                                            onChange={() => toggleSub(sub.id)}
                                                            disabled={alreadySent}
                                                            className="mr-3"
                                                        />
                                                        <div className="flex-1">
                                                            <p className="text-sm font-medium text-gray-900">{sub.name}</p>
                                                            <p className="text-xs text-gray-600">{sub.email}</p>
                                                        </div>
                                                        {alreadySent && (
                                                            <span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">Sent</span>
                                                        )}
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                            <h3 className="text-lg font-semibold mb-4">Email Template</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                                    <input
                                        type="text"
                                        value={emailSubject}
                                        onChange={(e) => setEmailSubject(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Message</label>
                                    <textarea
                                        value={emailBody}
                                        onChange={(e) => setEmailBody(e.target.value)}
                                        rows="12"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                {error && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
                                        {error}
                                    </div>
                                )}
                                <button
                                    onClick={handleSendITB}
                                    disabled={selectedSubs.length === 0 || sending}
                                    className="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium disabled:bg-gray-300 disabled:cursor-not-allowed"
                                >
                                    {sending ? '📧 Sending Emails...' : `Send ITB to ${selectedSubs.length} Subcontractor${selectedSubs.length !== 1 ? 's' : ''}`}
                                </button>
                            </div>
                        </div>
                    </div>

                    {projectBids.length > 0 && (
                        <div className="mt-6 bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                            <h3 className="text-lg font-semibold mb-4">ITB Status Tracking</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="table-cell text-left text-sm font-semibold text-gray-700">Subcontractor</th>
                                            <th className="table-cell text-left text-sm font-semibold text-gray-700">CSI Code</th>
                                            <th className="table-cell text-left text-sm font-semibold text-gray-700">Status</th>
                                            <th className="table-cell text-left text-sm font-semibold text-gray-700">Sent Date</th>
                                            <th className="table-cell text-left text-sm font-semibold text-gray-700">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {projectBids.map(bid => {
                                            const sub = subcontractors.find(s => s.id === bid.subcontractorId);
                                            return (
                                                <tr key={bid.id} className="hover:bg-gray-50">
                                                    <td className="table-cell text-sm text-gray-900">{sub?.name}</td>
                                                    <td className="table-cell text-sm text-gray-600">{sub?.csiCode}</td>
                                                    <td className="table-cell text-sm">
                                                        <span className={`px-2 py-1 rounded text-xs font-medium ${
                                                            bid.status === "Submitted" ? "bg-green-100 text-green-800" :
                                                            bid.status === "Declined" ? "bg-red-100 text-red-800" :
                                                            "bg-yellow-100 text-yellow-800"
                                                        }`}>
                                                            {bid.status}
                                                        </span>
                                                    </td>
                                                    <td className="table-cell text-sm text-gray-600">
                                                        {new Date(bid.sentDate).toLocaleDateString()}
                                                    </td>
                                                    <td className="table-cell text-sm">
                                                        <button className="text-blue-600 hover:text-blue-700">View</button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Bid Comparison Component
        function BidComparison({ project, bids, subcontractors, setCurrentView }) {
            const projectBids = bids.filter(b => b.projectId === project.id && b.status === "Submitted");
            
            const groupedBids = projectBids.reduce((acc, bid) => {
                const sub = subcontractors.find(s => s.id === bid.subcontractorId);
                const csiCode = sub?.csiCode || "Unknown";
                if (!acc[csiCode]) acc[csiCode] = [];
                acc[csiCode].push({ ...bid, subcontractor: sub });
                return acc;
            }, {});

            return (
                <div>
                    <div className="mb-6">
                        <button
                            onClick={() => setCurrentView("dashboard")}
                            className="text-blue-600 hover:text-blue-700 font-medium"
                        >
                            ← Back to Dashboard
                        </button>
                    </div>

                    <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200 mb-6">
                        <h2 className="text-xl font-semibold text-gray-900 mb-2">Bid Comparison - {project.name}</h2>
                        <p className="text-sm text-gray-600">{projectBids.length} bid(s) received</p>
                    </div>

                    {Object.entries(groupedBids).map(([csiCode, csiBids]) => {
                        const division = CSI_DIVISIONS.find(d => d.code === csiCode);
                        return (
                            <div key={csiCode} className="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
                                <div className="bg-blue-50 px-6 py-3 border-b border-gray-200">
                                    <h3 className="text-lg font-semibold text-gray-900">
                                        CSI {csiCode} - {division?.name || "Unknown"}
                                    </h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className="bg-gray-50">
                                            <tr>
                                                <th className="table-cell text-left text-sm font-semibold text-gray-700">Subcontractor</th>
                                                <th className="table-cell text-right text-sm font-semibold text-gray-700">Bid Amount</th>
                                                <th className="table-cell text-left text-sm font-semibold text-gray-700">Timeline</th>
                                                <th className="table-cell text-left text-sm font-semibold text-gray-700">Inclusions</th>
                                                <th className="table-cell text-left text-sm font-semibold text-gray-700">Exclusions</th>
                                                <th className="table-cell text-left text-sm font-semibold text-gray-700">Notes</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {csiBids.sort((a, b) => (a.bidAmount || 0) - (b.bidAmount || 0)).map(bid => (
                                                <tr key={bid.id} className="hover:bg-gray-50">
                                                    <td className="table-cell text-sm font-medium text-gray-900">
                                                        {bid.subcontractor?.name}
                                                    </td>
                                                    <td className="table-cell text-right text-sm font-semibold text-gray-900">
                                                        ${bid.bidAmount?.toLocaleString() || "N/A"}
                                                    </td>
                                                    <td className="table-cell text-sm text-gray-700">{bid.timeline || "N/A"}</td>
                                                    <td className="table-cell text-sm text-gray-700">{bid.inclusions || "N/A"}</td>
                                                    <td className="table-cell text-sm text-gray-700">{bid.exclusions || "N/A"}</td>
                                                    <td className="table-cell text-sm text-gray-600">{bid.notes || "-"}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        );
                    })}

                    {projectBids.length === 0 && (
                        <div className="bg-gray-50 rounded-lg p-12 text-center">
                            <p className="text-gray-600">No bids have been submitted yet.</p>
                        </div>
                    )}

                    <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                        <button className="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium">
                            Export to Proposal
                        </button>
                    </div>
                </div>
            );
        }

        // Public Bid Portal Component (No Authentication Required)
        function PublicBidPortal({ itbId }) {
            const [itbData, setItbData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [submitting, setSubmitting] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [bidForm, setBidForm] = useState({
                bidAmount: '',
                timeline: '',
                inclusions: '',
                exclusions: '',
                notes: ''
            });

            // Fetch ITB details on mount
            useEffect(() => {
                const fetchITB = async () => {
                    try {
                        console.log('Fetching ITB details for ID:', itbId);
                        const res = await fetch(`${API_BASE_URL}/api/itbs/public/${itbId}`);
                        
                        if (!res.ok) {
                            if (res.status === 404) {
                                throw new Error('ITB not found. This invitation may have expired or the link is invalid.');
                            }
                            throw new Error('Failed to load ITB details');
                        }
                        
                        const data = await res.json();
                        console.log('ITB data loaded:', data);
                        setItbData(data);
                    } catch (err) {
                        console.error('Error fetching ITB:', err);
                        setError(err.message);
                    } finally {
                        setLoading(false);
                    }
                };
                
                fetchITB();
            }, [itbId]);

            const handleSubmitBid = async (e) => {
                e.preventDefault();
                setSubmitting(true);
                setError('');

                try {
                    // Validate required fields
                    if (!bidForm.bidAmount || parseFloat(bidForm.bidAmount) <= 0) {
                        throw new Error('Please enter a valid bid amount');
                    }

                    console.log('Submitting bid:', {
                        itb_id: itbData.itb_id,
                        project_id: itbData.project_id,
                        subcontractor_id: itbData.subcontractor_id,
                        ...bidForm
                    });

                    const res = await fetch(`${API_BASE_URL}/api/bids`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            itb_id: itbData.itb_id,
                            project_id: itbData.project_id,
                            subcontractor_id: itbData.subcontractor_id,
                            bid_amount: parseFloat(bidForm.bidAmount),
                            timeline: bidForm.timeline,
                            inclusions: bidForm.inclusions,
                            exclusions: bidForm.exclusions,
                            notes: bidForm.notes
                        })
                    });

                    if (!res.ok) {
                        const errorData = await res.json();
                        throw new Error(errorData.error || 'Failed to submit bid');
                    }

                    const result = await res.json();
                    console.log('Bid submitted successfully:', result);
                    setSubmitted(true);
                } catch (err) {
                    console.error('Error submitting bid:', err);
                    setError(err.message);
                } finally {
                    setSubmitting(false);
                }
            };

            const handleDecline = async () => {
                if (!confirm('Are you sure you want to decline this invitation to bid?')) {
                    return;
                }

                setSubmitting(true);
                setError('');

                try {
                    // Update ITB status to declined
                    const res = await fetch(`${API_BASE_URL}/api/itbs/${itbData.itb_id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            status: 'declined'
                        })
                    });

                    if (!res.ok) {
                        throw new Error('Failed to decline ITB');
                    }

                    alert('You have declined this invitation to bid.');
                    window.location.reload();
                } catch (err) {
                    console.error('Error declining ITB:', err);
                    setError(err.message);
                } finally {
                    setSubmitting(false);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-gray-600">Loading invitation details...</div>
                    </div>
                );
            }

            if (error && !itbData) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
                            <div className="text-center">
                                <div className="text-6xl mb-4">⚠️</div>
                                <h2 className="text-2xl font-bold text-gray-900 mb-4">Error</h2>
                                <p className="text-gray-600 mb-6">{error}</p>
                                <p className="text-sm text-gray-500">
                                    Please contact the project estimator if you believe this is an error.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (submitted) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
                            <div className="text-center">
                                <div className="text-6xl mb-4">✅</div>
                                <h2 className="text-2xl font-bold text-gray-900 mb-4">Bid Submitted Successfully!</h2>
                                <p className="text-gray-600 mb-6">
                                    Thank you for submitting your bid for <strong>{itbData.project_name}</strong>.
                                </p>
                                <p className="text-gray-600">
                                    The project estimator will review your bid and contact you soon.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6 border border-gray-200">
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">Invitation to Bid</h1>
                            <p className="text-gray-600">
                                You have been invited to submit a bid for the following project:
                            </p>
                        </div>

                        {/* Project Details */}
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6 border border-gray-200">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Project Information</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-1">Project Name</label>
                                    <p className="text-gray-900 font-semibold">{itbData.project_name}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-1">Project Number</label>
                                    <p className="text-gray-900">{itbData.project_number}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-1">Location</label>
                                    <p className="text-gray-900">{itbData.project_address || 'N/A'}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-1">Bid Due Date</label>
                                    <p className={`font-semibold ${itbData.is_past_due ? 'text-red-600' : 'text-gray-900'}`}>
                                        {new Date(itbData.bid_due_date).toLocaleDateString()}
                                        {itbData.is_past_due && ' (Past Due)'}
                                    </p>
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm font-medium text-gray-500 mb-1">Invitation Sent To</label>
                                    <p className="text-gray-900">{itbData.subcontractor_name}</p>
                                </div>
                            </div>

                            {itbData.is_past_due && (
                                <div className="mt-4 bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                                    <p className="text-yellow-800 text-sm">
                                        ⚠️ <strong>Note:</strong> The bid due date has passed. Please contact the project estimator if you still wish to submit a bid.
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* Bid Submission Form */}
                        <form onSubmit={handleSubmitBid} className="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Submit Your Bid</h2>
                            
                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
                                    {error}
                                </div>
                            )}

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Bid Amount * <span className="text-gray-500 text-xs">(USD)</span>
                                    </label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={bidForm.bidAmount}
                                        onChange={(e) => setBidForm({...bidForm, bidAmount: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        placeholder="Enter your bid amount"
                                        required
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Estimated Timeline
                                    </label>
                                    <input
                                        type="text"
                                        value={bidForm.timeline}
                                        onChange={(e) => setBidForm({...bidForm, timeline: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        placeholder="e.g., 8 weeks, 60 days"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Inclusions
                                    </label>
                                    <textarea
                                        value={bidForm.inclusions}
                                        onChange={(e) => setBidForm({...bidForm, inclusions: e.target.value})}
                                        rows="3"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        placeholder="What is included in your bid?"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Exclusions
                                    </label>
                                    <textarea
                                        value={bidForm.exclusions}
                                        onChange={(e) => setBidForm({...bidForm, exclusions: e.target.value})}
                                        rows="3"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        placeholder="What is NOT included in your bid?"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Additional Notes
                                    </label>
                                    <textarea
                                        value={bidForm.notes}
                                        onChange={(e) => setBidForm({...bidForm, notes: e.target.value})}
                                        rows="3"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        placeholder="Any additional information or clarifications"
                                    />
                                </div>

                                <div className="flex gap-3 pt-4">
                                    <button
                                        type="submit"
                                        disabled={submitting || itbData.is_past_due}
                                        className="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {submitting ? 'Submitting...' : 'Submit Bid'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleDecline}
                                        disabled={submitting}
                                        className="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium disabled:opacity-50"
                                    >
                                        Decline
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Subcontractor Portal Component
        function SubcontractorPortal({ projects, bids, setBids }) {
            const [selectedSub, setSelectedSub] = useState(null);
            const [selectedBid, setSelectedBid] = useState(null);
            const [bidForm, setBidForm] = useState({
                bidAmount: "",
                timeline: "",
                inclusions: "",
                exclusions: "",
                notes: "",
                estimatedResponseDate: ""
            });

            const availableBids = selectedSub 
                ? bids.filter(b => b.subcontractorId === selectedSub.id && b.status === "Pending")
                : [];

            const handleSelectBid = (bid) => {
                setSelectedBid(bid);
                setBidForm({
                    bidAmount: bid.bidAmount || "",
                    timeline: bid.timeline || "",
                    inclusions: bid.inclusions || "",
                    exclusions: bid.exclusions || "",
                    notes: bid.notes || "",
                    estimatedResponseDate: bid.estimatedResponseDate || ""
                });
            };

            const handleSubmitBid = () => {
                const updatedBids = bids.map(b => 
                    b.id === selectedBid.id 
                        ? { ...b, ...bidForm, bidAmount: parseFloat(bidForm.bidAmount), status: "Submitted", submittedDate: new Date().toISOString() }
                        : b
                );
                setBids(updatedBids);
                alert("Bid submitted successfully!");
                setSelectedBid(null);
                setBidForm({ bidAmount: "", timeline: "", inclusions: "", exclusions: "", notes: "", estimatedResponseDate: "" });
            };

            const handleDecline = () => {
                const updatedBids = bids.map(b => 
                    b.id === selectedBid.id 
                        ? { ...b, status: "Declined" }
                        : b
                );
                setBids(updatedBids);
                alert("ITB declined.");
                setSelectedBid(null);
            };

            return (
                <div>
                    <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200 mb-6">
                        <h2 className="text-xl font-semibold text-gray-900 mb-4">Subcontractor Bid Portal</h2>
                        <p className="text-sm text-gray-600 mb-4">Select your company to view and submit bids</p>
                        <select
                            value={selectedSub?.id || ""}
                            onChange={(e) => {
                                const sub = INITIAL_SUBS.find(s => s.id === parseInt(e.target.value));
                                setSelectedSub(sub);
                                setSelectedBid(null);
                            }}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        >
                            <option value="">Select Your Company</option>
                            {INITIAL_SUBS.map(sub => (
                                <option key={sub.id} value={sub.id}>{sub.name}</option>
                            ))}
                        </select>
                    </div>

                    {selectedSub && !selectedBid && (
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                            <h3 className="text-lg font-semibold mb-4">Active ITBs for {selectedSub.name}</h3>
                            {availableBids.length === 0 ? (
                                <p className="text-gray-600">No active ITBs at this time.</p>
                            ) : (
                                <div className="grid gap-4">
                                    {availableBids.map(bid => {
                                        const project = projects.find(p => p.id === bid.projectId);
                                        return (
                                            <div key={bid.id} className="p-4 bg-gray-50 rounded-lg hover:bg-gray-100">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div>
                                                        <h4 className="font-semibold text-gray-900">{project?.name}</h4>
                                                        <p className="text-sm text-gray-600">{project?.projectNumber} • {project?.address}</p>
                                                    </div>
                                                    <span className="px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs font-medium">
                                                        Pending
                                                    </span>
                                                </div>
                                                <p className="text-sm text-gray-700 mb-3">
                                                    Bid Due: {new Date(project?.bidDueDate).toLocaleDateString()}
                                                </p>
                                                <button
                                                    onClick={() => handleSelectBid(bid)}
                                                    className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium"
                                                >
                                                    Submit Bid
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {selectedBid && (
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                            <button
                                onClick={() => setSelectedBid(null)}
                                className="text-blue-600 hover:text-blue-700 font-medium mb-4"
                            >
                                ← Back to ITB List
                            </button>
                            
                            <h3 className="text-lg font-semibold mb-4">
                                Submit Bid - {projects.find(p => p.id === selectedBid.projectId)?.name}
                            </h3>
                            
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Bid Amount ($) *</label>
                                    <input
                                        type="number"
                                        value={bidForm.bidAmount}
                                        onChange={(e) => setBidForm({...bidForm, bidAmount: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        placeholder="150000"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Timeline to Complete</label>
                                    <input
                                        type="text"
                                        value={bidForm.timeline}
                                        onChange={(e) => setBidForm({...bidForm, timeline: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        placeholder="6 weeks"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Inclusions</label>
                                    <textarea
                                        value={bidForm.inclusions}
                                        onChange={(e) => setBidForm({...bidForm, inclusions: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        rows="3"
                                        placeholder="Materials, labor, equipment..."
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Exclusions</label>
                                    <textarea
                                        value={bidForm.exclusions}
                                        onChange={(e) => setBidForm({...bidForm, exclusions: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        rows="3"
                                        placeholder="Items not included in bid..."
                                    />
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Additional Notes</label>
                                    <textarea
                                        value={bidForm.notes}
                                        onChange={(e) => setBidForm({...bidForm, notes: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        rows="3"
                                    />
                                </div>
                            </div>

                            <div className="flex gap-3">
                                <button
                                    onClick={handleSubmitBid}
                                    disabled={!bidForm.bidAmount}
                                    className="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium disabled:bg-gray-300"
                                >
                                    Submit Bid
                                </button>
                                <button
                                    onClick={handleDecline}
                                    className="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium"
                                >
                                    Decline ITB
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
